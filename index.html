<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="https://projektcity.com/assets/images/logos/favicon-f.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Forms - Projekt City</title>
	<!-- Styles -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&family=Roboto&display=swap">
	<link rel="stylesheet" href="https://itsmarian-static.is-a.dev/fonts/font-awesome-6.7.2/css/all.css">
	<link rel="stylesheet" href="https://projektcity.com/assets/global/cookiebanner/styles.css">
	<link rel="stylesheet" href="https://projektcity.com/assets/global/footer.css">
	<link rel="stylesheet" href="https://projektcity.com/assets/global/header.css">
	<link rel="stylesheet" href="https://projektcity.com/assets/global/styles.css">
	<link rel="stylesheet" href="https://projektcity.com/assets/global/variables.css">
	<link rel="stylesheet" href="assets/form.css">
	<!-- i18n Configuration -->
	<script>
		window.i18nConfig = {
			pageStringsPath: 'https://projektcity.com/assets/strings/forms/index/'
		};
	</script>
	<script src="https://projektcity.com/assets/global/language.js"></script>
	<!-- Scripts -->
	<script src="https://projektcity.com/assets/global/cookiebanner/script.js"></script>
	<script src="https://projektcity.com/assets/global/header.js"></script>
	<script src="https://projektcity.com/assets/global/footer.js"></script>
	<!-- META -->
	<meta name="author" content="Projekt City Ltd.">
	<meta name="description" content="Submit feedback, ideas or bug reports to the Projekt City team.">
	<meta name="robots" content="noindex, nofollow">
	<meta name="referrer" content="no-referrer">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta property="og:title" content="Forms - Projekt City">
	<meta property="og:description" content="Submit feedback, ideas or bug reports to the Projekt City team.">
	<meta property="og:image" content="https://projektcity.com/assets/images/logos/favicon.png">
	<meta property="og:url" content="https://forms.projekcity.com/">
	<meta property="og:type" content="website">
</head>
<body>
	<header></header>
	<main>
		<h2 data-i18n="index_heading">Submit a form</h2>
		<p class="index-sub" data-i18n="index-sub">Choose what you'd like to send to the Projekt City team.</p>
		<nav class="form-nav" aria-label="Form types">
			<a class="nav-card" href="/suggest-improvement">
				<span class="nav-icon"><i class="fas fa-bug"></i></span>
				<span class="nav-title" data-i18n="nav_bug_report">Bug Report</span>
				<span class="nav-desc" data-i18n="nav_bug_report_desc">Something broken or not working as expected.</span>
			</a>
			<a class="nav-card" href="/feedback">
				<span class="nav-icon"><i class="fas fa-comment"></i></span>
				<span class="nav-title" data-i18n="nav_feedback">Feedback</span>
				<span class="nav-desc" data-i18n="nav_feedback_desc">Share your experience or general thoughts.</span>
			</a>
			<a class="nav-card" href="/idea">
				<span class="nav-icon"><i class="fas fa-lightbulb"></i></span>
				<span class="nav-title" data-i18n="nav_idea">Idea</span>
				<span class="nav-desc" data-i18n="nav_idea_desc">Suggest a feature or improvement.</span>
			</a>
		</nav>
	</main>
	<footer></footer>
</body>
</html>
